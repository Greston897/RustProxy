name: Build RustProxy

on:
  push:
    branches: [arena/4528e98d-rustproxy, arena/656a3782-rustproxy]
  pull_request:
    branches: [arena/4528e98d-rustproxy, arena/656a3782-rustproxy]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-v2-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache target directory
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-target-v3-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release
        shell: bash
        run: |
          cargo build --release > build.log 2>&1 || {
            {
              echo '## cargo build --release FAILED'
              echo ''
              echo '```'
              grep -E '^(error|warning: unused)' build.log | head -60
              echo '--- tail build.log ---'
              tail -n 150 build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            grep -E '^error' build.log | head -10 | while IFS= read -r line; do
              esc=$(printf '%s' "$line" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' -e 's/\n/%0A/g')
              echo "::error::$esc"
            done
            echo '----- build.log tail -----'
            tail -n 40 build.log
            exit 1
          }

      - name: Show release binary size
        run: ls -lh target/release/rustproxy

      - name: Upload release binary
        uses: actions/upload-artifact@v4
        with:
          name: rustproxy-release
          path: target/release/rustproxy
          retention-days: 7
