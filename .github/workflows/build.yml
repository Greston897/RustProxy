name: Build RustProxy

on:
  push:
    branches: [arena/4528e98d-rustproxy, arena/656a3782-rustproxy]
  pull_request:
    branches: [arena/4528e98d-rustproxy, arena/656a3782-rustproxy]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-v2-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache target directory
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-target-v3-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release
        shell: bash
        run: |
          cargo build --release > build.log 2>&1 || {
            sed -e 's/\x1b\[[0-9;]*m//g' build.log > build.clean.log
            {
              echo '## cargo build --release FAILED'
              echo ''
              echo '```'
              grep -n -E -A6 '^error' build.clean.log | head -300
              echo '--- tail build.log ---'
              tail -n 80 build.clean.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            # Одна большая аннотация с блоками ошибок (видна через check-runs API)
            MSG=$(grep -E -A6 '^error' build.clean.log | head -c 6000 | sed -e 's/%/%25/g' -e 's/\r/%0D/g' -e ':a;N;$!ba;s/\n/%0A/g')
            echo "::error::$MSG"
            # По одному annotations на каждую строку-локацию rustc (file:line)
            grep -E '^[[:space:]]+--> ' build.clean.log | head -8 | while IFS= read -r loc; do
              path=$(printf '%s' "$loc" | sed -E 's/.*-->[[:space:]]*([^:]+):.*/\1/' | tr -d ' ')
              line=$(printf '%s' "$loc" | grep -oE ':[0-9]+:[0-9]+' | head -1 | cut -d: -f2)
              if [ -n "$path" ] && [ -n "$line" ]; then
                echo "::error file=$path,line=$line::see build error details"
              fi
            done
            exit 1
          }

      - name: Show release binary size
        run: ls -lh target/release/rustproxy

      - name: Upload release binary
        uses: actions/upload-artifact@v4
        with:
          name: rustproxy-release
          path: target/release/rustproxy
          retention-days: 7
