name: Build RustProxy

on:
  push:
    branches: [arena/4528e98d-rustproxy, arena/656a3782-rustproxy]
  pull_request:
    branches: [arena/4528e98d-rustproxy, arena/656a3782-rustproxy]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: never

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-v2-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache target directory
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-target-v3-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release
        shell: bash
        run: |
          cargo build --release > build.log 2>&1 || {
            sed -e 's/\x1b\[[0-9;]*m//g' build.log > build.clean.log
            {
              echo '## cargo build --release FAILED'
              echo ''
              echo '```'
              grep -n -E -A6 '^error' build.clean.log | head -300
              echo '--- tail build.log ---'
              tail -n 80 build.clean.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            # Только блоки `^error` (без warnings) — всё помещается в ~10 аннотаций
            python3 << 'PYEOF'
          import re
          data = open('build.clean.log', errors='replace').read()
          parts = re.split(r'(?m)(?=^error)', data)
          parts = [p for p in parts if p.startswith('error')]
          print(f'TOTAL_ERROR_BLOCKS={len(parts)}')
          text = '\n'.join(p.rstrip() for p in parts)
          text = text[-60000:]
          chunks = [text[i:i+6000] for i in range(0, len(text), 6000)][:9]
          for idx, c in enumerate(chunks):
              c = c.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title=errlog-{idx:02d}/{len(chunks)-1:02d}::{c}')
          PYEOF
            exit 1
          }

      - name: Show release binary size
        run: ls -lh target/release/rustproxy

      - name: Upload release binary
        uses: actions/upload-artifact@v4
        with:
          name: rustproxy-release
          path: target/release/rustproxy
          retention-days: 7
